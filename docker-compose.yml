services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/openmedicine
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    profiles:
      - local-graph

  openmedicine:
    build: .
    ports:
      - "8000:8000"
    environment:
      GRAPHRAG_NEO4J_URI: ${GRAPHRAG_NEO4J_URI}
      GRAPHRAG_NEO4J_USER: ${GRAPHRAG_NEO4J_USER}
      GRAPHRAG_NEO4J_PASSWORD: ${GRAPHRAG_NEO4J_PASSWORD}
      OM_AUTH_MODE: ${OM_AUTH_MODE:-none}
      OM_API_KEYS: ${OM_API_KEYS:-}

volumes:
  neo4j_data:
