[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-medicine"
version = "0.1.0"
description = "Evidence-Based Clinical Reasoning for AI Agents"
readme = "README.md"
authors = [
    { name = "Felipe Ramos" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ascvd>=0.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_medicine"]

[project.scripts]
open-medicine-mcp = "open_medicine.mcp.server:main"
