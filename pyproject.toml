[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-medicine"
version = "0.1.0"
description = "Evidence-Based Clinical Reasoning for AI Agents"
readme = "README.md"
authors = [
    { name = "Felipe Ramos" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "mcp>=1.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_medicine"]
