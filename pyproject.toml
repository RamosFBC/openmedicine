[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-medicine"
version = "0.11.0"
description = "Evidence-Based Clinical Reasoning for AI Agents — deterministic calculators, clinical guidelines, and MCP tools backed by DOI-traceable evidence."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Felipe Ramos" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed"
]
keywords = [
    "clinical-decision-support",
    "evidence-based-medicine",
    "fhir",
    "mcp",
    "healthcare",
    "calculators",
    "guidelines",
    "ai-agents"
]

[project.urls]
Homepage = "https://github.com/RamosFBC/openmedicine"
Repository = "https://github.com/RamosFBC/openmedicine"
Issues = "https://github.com/RamosFBC/openmedicine/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ascvd>=0.5"
]
embeddings = [
    "httpx>=0.27.0",
]
graphrag = [
    "neo4j>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "pydantic-settings>=2.0.0",
]
service = [
    "uvicorn>=0.30.0",
    "sse-starlette>=1.6.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_medicine"]

[project.scripts]
open-medicine-mcp = "open_medicine.mcp.server:main"
open-medicine-graphrag = "open_medicine.graphrag.server.mcp_server:main"
open-medicine-graphrag-ingest = "open_medicine.graphrag.ingest:main"
open-medicine-server = "open_medicine.server.__main__:main"
