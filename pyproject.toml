[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-medicine"
version = "0.13.1"
description = "MCP server for deterministic, DOI-traceable medical calculators and clinical scores."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Felipe Ramos" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed"
]
keywords = [
    "mcp",
    "medical-calculators",
    "clinical-scores",
    "clinical-decision-support",
    "healthcare",
    "calculators"
]

[project.urls]
Homepage = "https://github.com/RamosFBC/openmedicine"
Repository = "https://github.com/RamosFBC/openmedicine"
Issues = "https://github.com/RamosFBC/openmedicine/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ascvd>=0.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_medicine"]

[project.scripts]
open-medicine-mcp = "open_medicine.mcp.server:main"
